[package]
name = "zdict-app"
description = "Desktop app logic over a ZDict pack: commands, settings overlay, saved config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zdict-core = { path = "../zdict-core" }
zdict-html = { path = "../zdict-html" }

[dev-dependencies]
tempfile = "3"
