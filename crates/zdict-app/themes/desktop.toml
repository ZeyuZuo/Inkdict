# ZDict desktop theme: the application layer of the theme stack
# (spec/v0.md §7.2), above the pack's own theme and below the user's
# settings. It only overrides what the desktop design changes: one reading
# serif (bundled Source Serif 4) with a serif CJK face, a quiet palette with
# the dictionary's navy as the one accent, level codes as small tinted
# chips of one size, pronunciations inline, and no heavy pills.
#
# A higher layer outranks every rule below it, so contextual rules of the
# pack theme that a broad rule here would override are restated.

[meta]
format = "zdict-theme"
version = 0
name = "ZDict Desktop"

[fonts]
text = ["Source Serif 4 Variable", "Source Serif 4", "Noto Serif", "Georgia", "serif"]
phonetic = ["Source Serif 4 Variable", "Noto Serif", "Charis SIL", "serif"]
cjk = ["Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", "serif"]
ui = ["Inter", "Noto Sans", "Noto Sans CJK SC", "PingFang SC", "system-ui", "sans-serif"]
chip = ["Inter", "Noto Sans", "system-ui", "sans-serif"]

[colors.light]
fg = "#1c2230"
muted = "#5f6776"
faint = "#8b93a1"
headword = "#0e2a5e"
accent = "#1f3f8a"
link = "#1f3f8a"
gb = "#1f3f8a"
us = "#1f3f8a"
key = "#e08600"
rule = "#e3e6eb"
box = "#f1f3f7"
chip = "#eceff4"
chip_fg = "#4a5262"
cefr_bg = "#e3e9f6"
cefr_fg = "#1f3f8a"
tag = "#e4e8ef"
tag_fg = "#3d4555"

[colors.dark]
fg = "#e4e6ea"
muted = "#a1a8b3"
faint = "#737b88"
headword = "#bccdf3"
accent = "#9fb6ec"
link = "#9fb6ec"
gb = "#9fb6ec"
us = "#9fb6ec"
key = "#f0a440"
rule = "#2a2f37"
box = "#1b1f26"
chip = "#242a33"
chip_fg = "#b3bac5"
cefr_bg = "#1f2a40"
cefr_fg = "#aec2f2"
tag = "#2a303a"
tag_fg = "#c9cfd8"

# ---------- base ----------

[style.entry]
size = 1.0
line_height = 1.65

# ---------- head line ----------

[style."entry > head"]
space_after = 0.9

[style."entry > head > headword"]
size = 2.35
space_end = 0.45

[style.badge]
font = "chip"
size = 0.62
line_height = 1.0
weight = "bold"
color = "chip_fg"
background = "chip"
radius = 0.3
padding = 0.45
space_end = 0.3

[style."badge[scheme=cefr]"]
color = "cefr_fg"
background = "cefr_bg"

[style."badge[scheme=ox3000]"]
color = "key"
background = "clear"
padding = 0
radius = 0
size = 0.8

[style."badge[scheme=ox5000]"]
color = "key"
background = "clear"
padding = 0

[style."entry > head > badge"]
size = 0.7

[style."entry > head > badge[scheme=ox3000]"]
size = 1.05

[style."sense > head > badge"]
size = 0.56
space_end = 0.28

[style."sense > head > badge[scheme=ox3000]"]
size = 0.8
background = "clear"
padding = 0

# Pronunciations: inline, no pills.
[style."entry > head > pron_list"]
display = "block"
space_before = 0.4

[style."entry > head pron"]
background = "clear"
padding = 0
radius = 0
space_end = 1.2
size = 0.95

[style.region]
font = "ui"
style = "normal"
size = 0.74
color = "muted"
after = " "

[style."entry > head ipa"]
weight = "normal"

[style."pron::icon"]
color = "accent"

[style."pron[region=US]::icon"]
color = "accent"

# Part of speech: italic navy text instead of a filled pill.
[style."pos_group > head > pos"]
style = "italic"
weight = "normal"
color = "accent"
background = "clear"
padding = 0
radius = 0
size = 1.08
space_end = 0.35

[style.inflections]
color = "muted"

[style.infl_form]
weight = "normal"
after = ""

[style."inflection pron"]
space_start = 0.3

[style.grammar]
color = "faint"

# ---------- senses ----------

[style.pos_group]
space_before = 1.25

[style."pos_group > head"]
space_after = 0.5

[style.sense_group]
space_before = 1.3

[style.sense_group_title]
size = 0.74
color = "accent"

[style.sense]
space_before = 0.85
line_height = 1.65

[style."sense::before"]
weight = "bold"
color = "accent"

[style.example]
marker = "–"
indent = 1.2
space_before = 0.55

[style."example::marker"]
size = 0.9
color = "faint"

[style."example > labels"]
after = ") "

[style."example_text[lang=zh]"]
color = "muted"
size = 0.92
space_before = 0.15

[style.target]
color = "link"

# ---------- sections and boxes ----------

[style."idiom_list::title"]
case = "none"
size = 0.8
color = "accent"

[style."phrasal_verb_list::title"]
case = "none"
size = 0.8
color = "accent"

[style."derivative_list::title"]
case = "none"
size = 0.8
color = "accent"

[style."note::title"]
case = "none"
size = 0.78

[style."word_family::title"]
case = "none"
size = 0.78

[style.note]
radius = 0.4

[style.word_family]
radius = 0.4

[style.box]
radius = 0.4
