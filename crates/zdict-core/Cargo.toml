[package]
name = "zdict-core"
description = "Reads ZDict dictionary packs (.zdpack): entries, lookup, full-text search, resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }
caseless = "0.2.2"
fst = "0.4.7"
unicode-normalization = "0.1.26"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
zstd = "0.14"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
