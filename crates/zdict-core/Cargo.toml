[package]
name = "zdict-core"
description = "Reads ZDict dictionary packs (.zdpack): entries, lookup, full-text search, resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
thiserror = "2"
zstd = "0.14"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
