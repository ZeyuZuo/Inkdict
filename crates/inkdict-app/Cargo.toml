[package]
name = "inkdict-app"
description = "Desktop app logic over an Inkdict pack: commands, settings overlay, saved config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
inkdict-core = { path = "../inkdict-core" }
inkdict-html = { path = "../inkdict-html" }

[dev-dependencies]
tempfile = "3"
