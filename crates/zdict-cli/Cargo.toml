[package]
name = "zdict-cli"
description = "Command-line dictionary lookup and benchmarks for ZDict packs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "zdict"
path = "src/main.rs"

[dependencies]
zdict-core = { path = "../zdict-core" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
anyhow = "1"
tiny_http = "0.12"
zdict-app = { path = "../zdict-app" }
