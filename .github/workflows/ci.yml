name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The toolchain comes from rust-toolchain.toml. On failure the
      # failing lines also become an annotation, readable without the log.
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --no-fail-fast 2>&1 | tee test.log; then
            summary=$(grep -E -A4 "^error|^test .* FAILED|panicked at" test.log | head -150 \
              | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo test failed::${summary}"
            exit 1
          fi

  lint:
    name: Lint, desktop build check, UI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: UI checks, tests and build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
