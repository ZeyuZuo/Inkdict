[workspace]
resolver = "3"
members = ["crates/zdict-core", "crates/zdict-html", "crates/zdict-app", "crates/zdict-cli", "apps/desktop/src-tauri"]
# The desktop app needs WebKitGTK to build; plain `cargo test` skips it.
default-members = ["crates/zdict-core", "crates/zdict-html", "crates/zdict-app", "crates/zdict-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

# The oxdata tests decode all 39,960 entries; unoptimized they take ~18 s.
[profile.test]
opt-level = 1
