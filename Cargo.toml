[workspace]
resolver = "3"
members = ["crates/inkdict-core", "crates/inkdict-html", "crates/inkdict-app", "crates/inkdict-cli", "crates/inkdict-pack", "apps/desktop/src-tauri"]
# The desktop app needs WebKitGTK to build; plain `cargo test` skips it.
default-members = ["crates/inkdict-core", "crates/inkdict-html", "crates/inkdict-app", "crates/inkdict-cli", "crates/inkdict-pack"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZeyuZuo/Inkdict"

# The oxdata tests decode all 39,960 entries; unoptimized they take ~18 s.
[profile.test]
opt-level = 1
