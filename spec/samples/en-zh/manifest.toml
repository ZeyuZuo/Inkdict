# The manifest: reading a dictionary's source directory starts here
# (spec/pack-v1.md). Paths are relative to this file. The entries are invented.

[meta]
format = "inkdict-source"
version = 1

[pack]
id = "sample-en-zh"
title = "示例英汉双解词典"
edition = "1"
license = "CC0-1.0"

[languages]
source = "en"            # language of headwords and original text (BCP 47)
targets = ["zh-Hans"]    # translation languages; [] for a monolingual dictionary

[files]
types = "types.toml"
themes = ["themes/default.toml"]   # the first is the default theme
entries = "entries.jsonl"          # one entry (node tree) per line
summaries = "summaries.jsonl"      # optional
resources = "resources"            # optional: resources/<kind>/<key>.<ext>, stored in the pack

[lookup]
norm = "fold-1"
# Between equal matches, entries with a node matching these selectors come first, in list order.
boost = ["badge[scheme=core]"]

# Files not stored in the pack are fetched from here (optional; tried in order).
[[source]]
kind = "audio"
template = "https://media.example.org/sample-en-zh/audio/{key:uri}.mp3"
