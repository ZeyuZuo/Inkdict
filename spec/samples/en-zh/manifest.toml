# 打包清单：一部词典的源目录从这里开始读（spec/pack-v1.md）。
# 路径都相对本文件。本示例的词条内容为虚构。

[meta]
format = "inkdict-source"
version = 1

[pack]
id = "sample-en-zh"
title = "示例英汉双解词典"
edition = "1"
license = "CC0-1.0"

[languages]
source = "en"            # 词头和原文的语言（BCP 47）
targets = ["zh-Hans"]    # 译文的语言；单语词典写 []

[files]
types = "types.toml"
themes = ["themes/default.toml"]   # 第一个是默认主题
entries = "entries.jsonl"          # 每行一个词条（一棵节点树）
summaries = "summaries.jsonl"      # 可选
resources = "resources"            # 可选：resources/<类别>/<键>.<扩展名>，打进包里

[lookup]
norm = "fold-1"
# 同等匹配时，含有匹配这些选择器的节点的词条排在前面，按列表顺序。
boost = ["badge[scheme=core]"]

# 包里没有的资源，到这里在线取（可选，按顺序回退）。
[[source]]
kind = "audio"
template = "https://media.example.org/sample-en-zh/audio/{key:uri}.mp3"
