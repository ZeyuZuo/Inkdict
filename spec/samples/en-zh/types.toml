# 类型表：这部词典有哪些节点类型、怎么嵌套、各有什么用途（spec/v1.md §3）。
# 类型名属于这部词典自己；软件只认 roles，不认类型名。

[meta]
format = "inkdict-types"
version = 1

[groups]
inline = ["#text", "strong", "target", "translation"]
head = ["headword", "homograph", "badge", "variant", "pron_list", "pos", "inflections", "form_index"]

[types.entry]
kind = "block"
children = ["head", "pos_group", "image", "xref"]
roles = ["anchor"]

[types.head]
kind = "block"
children = ["@head"]

[types.headword]
kind = "inline"
children = ["#text"]
roles = ["index"]
index = "headword"

[types.homograph]
kind = "inline"
doc = "同形词编号：拼写相同的几个词条各自的序号"
children = ["#text"]
roles = ["homograph"]

[types.form_index]
kind = "inline"
doc = "只用于检索、不显示的词形"
children = ["#text"]
roles = ["index"]
index = "hidden"

[types.badge]
kind = "inline"
children = ["#text"]
attrs = { scheme = "enum(core|level)" }
doc = "core：核心词汇；level：难度等级"

[types.variant]
kind = "inline"
children = ["label", "variant_form"]

[types.variant_form]
kind = "inline"
children = ["#text"]
roles = ["index"]
index = "variant"

[types.label]
kind = "inline"
children = ["#text", "translation"]

[types.pron_list]
kind = "inline"
children = ["pron"]
roles = ["pronunciation"]

[types.pron]
kind = "inline"
children = ["ipa"]
attrs = { region = "enum(GB|US)", audio = "res?" }
roles = ["audio"]

[types.ipa]
kind = "inline"
children = ["#text"]

[types.pos_group]
kind = "block"
doc = "一个词性下的全部内容"
children = ["head", "sense", "idiom_list"]
roles = ["anchor"]

[types.pos]
kind = "inline"
children = ["#text"]

[types.inflections]
kind = "inline"
children = ["infl_form"]

[types.infl_form]
kind = "inline"
children = ["#text"]
roles = ["index"]
index = "inflection"

[types.sense]
kind = "block"
children = ["definition", "example", "xref"]
attrs = { n = "int?" }
roles = ["anchor"]

[types.definition]
kind = "inline"
children = ["@inline"]

[types.example]
kind = "block"
children = ["example_text"]
roles = ["anchor", "example"]

[types.example_text]
kind = "inline"
children = ["@inline"]

[types.idiom_list]
kind = "block"
children = ["idiom"]

[types.idiom]
kind = "block"
children = ["phrase", "sense"]
roles = ["anchor"]

[types.phrase]
kind = "inline"
children = ["#text", "alt", "opt"]
roles = ["index"]
index = "phrase"

[types.alt]
kind = "inline"
doc = "相邻的几个 alt 任选其一，各自进索引"
children = ["#text"]
roles = ["choice"]

[types.opt]
kind = "inline"
doc = "可有可无的部分，有和没有都进索引"
children = ["#text"]
roles = ["optional"]

[types.xref]
kind = "block"
children = ["#text", "target"]

[types.target]
kind = "inline"
children = ["#text"]
attrs = { entry = "ref?", anchor = "ref?" }
roles = ["link"]

[types.image]
kind = "block"
attrs = { res = "res" }
roles = ["image"]

[types.strong]
kind = "inline"
children = ["@inline"]

[types.translation]
kind = "inline"
doc = "附在短文本后的译文，如标签 NAmE 美式"
children = ["#text"]
